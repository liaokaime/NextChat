name: Release App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload to
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve the requested release
        id: release
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const release = context.eventName === 'release'
              ? context.payload.release
              : (await github.rest.repos.getReleaseByTag({
                  ...context.repo,
                  tag: process.env.RELEASE_TAG,
                })).data;
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', release.tag_name);
            core.setOutput('draft', String(release.draft));
            core.setOutput('prerelease', String(release.prerelease));

  build-tauri:
    needs: resolve-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: -- --locked
          - os: macos-latest
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            args: --target universal-apple-darwin -- --locked
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: -- --locked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          node -e 'const version = require("./src-tauri/tauri.conf.json").version; if (process.env.RELEASE_TAG.replace(/^v/, "") !== version) throw new Error("Release tag does not match app version");'
      - uses: ./.github/actions/setup-tauri
        with:
          rust-targets: ${{ matrix.rust_targets }}
      - name: Build and upload packages
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          releaseDraft: ${{ needs.resolve-release.outputs.draft == 'true' }}
          prerelease: ${{ needs.resolve-release.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
