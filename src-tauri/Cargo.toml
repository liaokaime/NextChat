[package]
name = "nextchat"
version = "0.1.0"
description = "A cross platform app for LLM ChatBot."
authors = ["Yidadaa"]
license = "mit"
repository = ""
default-run = "nextchat"
edition = "2021"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream", "charset", "http2", "system-proxy"] }
futures-util = "0.3.30"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-opener = "=2.7.2"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[features]
# This feature enables loading bundled frontend files in production.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
